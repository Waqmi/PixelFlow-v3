name: PixelFlow v3.0 platform builds

on:
  push:
    branches:
      - ci/v3.0-platform-builds-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            node_arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            # macos-14 is arm64; Python runs as x64 under Rosetta and Rust cross-compiles Intel.
            os: macos-14
            node_arch: arm64
            target: x86_64-apple-darwin
            bundles: app

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: ${{ github.workspace }}/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Ensure Rosetta 2
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve Python path for worker build
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PIXELFLOW_PYTHON="$(cygpath -u "$Python_ROOT_DIR/python.exe")"
          else
            PIXELFLOW_PYTHON="$RUNNER_TEMP/pixelflow-python-x64"
            printf '%s\n' '#!/bin/bash' 'exec arch -x86_64 "$Python_ROOT_DIR/bin/python3" "$@"' > "$PIXELFLOW_PYTHON"
            chmod +x "$PIXELFLOW_PYTHON"
          fi
          echo "PIXELFLOW_PYTHON=$PIXELFLOW_PYTHON" >> "$GITHUB_ENV"
          "$PIXELFLOW_PYTHON" -c 'import platform, sys; print("Python:", sys.executable, platform.machine())'

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rustup target add x86_64-apple-darwin
          fi
          rustc --version
          cargo --version

      - name: Verify Intel build toolchain
        if: runner.os == 'macOS'
        run: |
          "$PIXELFLOW_PYTHON" -c 'import platform; assert platform.machine() == "x86_64"; print("Python:", platform.machine())'
          rustc -vV | grep 'host:.*aarch64-apple-darwin'
          rustup target list --installed | grep '^x86_64-apple-darwin$'

      - name: Install worker dependencies
        run: |
          "$PIXELFLOW_PYTHON" -m pip install -r worker/requirements.lock

      - name: Run worker tests
        run: |
          "$PIXELFLOW_PYTHON" -m unittest discover -s worker/tests -p 'test_*.py'

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run protocol check
        working-directory: apps/desktop
        run: |
          "$PIXELFLOW_PYTHON" ../../tools/check_protocol_schema.py

      - name: Use bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell bash --location=global

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: List Windows raw build outputs
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: |
          release_dir="src-tauri/target/${{ matrix.target }}/release"
          find "$release_dir" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dll' \) -print | sort
          find "$release_dir/pixelflow-worker" -maxdepth 2 -type f -print | head -40 | sort

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: |
          output_file="$(find src-tauri/target/${{ matrix.target }}/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$output_file"
          cp "$output_file" "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe"
          sha256sum "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe" > "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe.sha256"

      - name: Package Windows portable artifact
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: |
          release_dir="src-tauri/target/${{ matrix.target }}/release"
          portable_dir="$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-portable"
          zip_file="$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-portable.zip"
          sfx_file="$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-portable.exe"
          nsi_file="$GITHUB_WORKSPACE/.github/nsis/portable-launcher.nsi"
          app_exe="$release_dir/PixelFlow.exe"
          resource_dir="$release_dir/pixelflow-worker"
          portable_dir_win="$(cygpath -w "$portable_dir")"
          zip_file_win="$(cygpath -w "$zip_file")"
          sfx_file_win="$(cygpath -w "$sfx_file")"
          nsi_file_win="$(cygpath -w "$nsi_file")"

          test -f "$app_exe"
          test -d "$resource_dir"
          test -f "$resource_dir/pixelflow-worker.exe"

          rm -rf "$portable_dir"
          mkdir -p "$portable_dir"
          cp "$app_exe" "$portable_dir/PixelFlow.exe"
          cp -a "$resource_dir" "$portable_dir/"
          find "$release_dir" -maxdepth 1 -type f -name '*.dll' -exec cp {} "$portable_dir/" \;

          if ! command -v makensis >/dev/null 2>&1; then
            local_tauri_dir="$(cygpath -u "$LOCALAPPDATA")/tauri"
            makensis_path="$(find "$local_tauri_dir" -type f -name makensis.exe -print -quit 2>/dev/null || true)"
            test -n "$makensis_path"
            PATH="$(dirname "$makensis_path"):$PATH"
          fi

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -Force -Path '$portable_dir_win' -DestinationPath '$zip_file_win'"

          makensis /DPORTABLE_DIR="$portable_dir_win" /DOUTPUT_FILE="$sfx_file_win" "$nsi_file_win"

          sha256sum "$zip_file" > "$zip_file.sha256"
          sha256sum "$sfx_file" > "$sfx_file.sha256"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/PixelFlow.app"
          test -d "$app_path"
          ditto -c -k --keepParent "$app_path" "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip" > "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip.sha256"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-windows-x64
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-windows-x64-setup.exe
            PixelFlow-v3.0-windows-x64-setup.exe.sha256

      - name: Upload Windows portable zip artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-windows-x64-portable-zip
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-windows-x64-portable.zip
            PixelFlow-v3.0-windows-x64-portable.zip.sha256

      - name: Upload Windows portable exe artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-windows-x64-portable-exe
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-windows-x64-portable.exe
            PixelFlow-v3.0-windows-x64-portable.exe.sha256

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-macos-intel
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-macos-intel.app.zip
            PixelFlow-v3.0-macos-intel.app.zip.sha256
