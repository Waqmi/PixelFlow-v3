name: PixelFlow v3.0 platform builds

on:
  push:
    branches:
      - ci/v3.0-platform-builds-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-14
            target: x86_64-apple-darwin
            bundles: app

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: ${{ github.workspace }}/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x64
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Ensure Rosetta 2
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve Python path for worker build
        run: |
          PIXELFLOW_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PIXELFLOW_PYTHON="$(cygpath -u "$PIXELFLOW_PYTHON")"
          fi
          echo "PIXELFLOW_PYTHON=$PIXELFLOW_PYTHON" >> "$GITHUB_ENV"

      - name: Set up stable Rust
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rustup toolchain install stable-x86_64-apple-darwin --profile minimal --no-self-update --force-non-host
            rustup default stable-x86_64-apple-darwin
            rustup target add x86_64-apple-darwin
          else
            rustup toolchain install stable --profile minimal --no-self-update
            rustup default stable
          fi
          rustc --version
          cargo --version

      - name: Verify x86_64 toolchain
        if: runner.os == 'macOS'
        run: |
          node -p "process.arch"
          python -c 'import platform; print(platform.machine())'
          rustc -vV | grep 'host:.*x86_64-apple-darwin'

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.lock

      - name: Run worker tests
        run: python -m unittest discover -s worker/tests -p 'test_*.py'

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run protocol check
        working-directory: apps/desktop
        run: python ../../tools/check_protocol_schema.py

      - name: Use bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell bash --location=global

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: |
          output_file="$(find src-tauri/target/${{ matrix.target }}/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$output_file"
          cp "$output_file" "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe"
          sha256sum "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe" > "$GITHUB_WORKSPACE/PixelFlow-v3.0-windows-x64-setup.exe.sha256"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/PixelFlow.app"
          test -d "$app_path"
          ditto -c -k --keepParent "$app_path" "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip" > "$GITHUB_WORKSPACE/PixelFlow-v3.0-macos-intel.app.zip.sha256"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-windows-x64
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-windows-x64-setup.exe
            PixelFlow-v3.0-windows-x64-setup.exe.sha256

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-v3.0-macos-intel
          if-no-files-found: error
          path: |
            PixelFlow-v3.0-macos-intel.app.zip
            PixelFlow-v3.0-macos-intel.app.zip.sha256
