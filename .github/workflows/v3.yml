name: PixelFlow v3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  worker:
    name: Worker tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install worker dependencies
        shell: bash
        run: python -m pip install -r worker/requirements.lock
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Add legacy engine modules to test import path
        shell: bash
        run: python -c "import os; print('PYTHONPATH=' + os.pathsep.join([os.environ.get('PYTHONPATH', 'worker'), 'worker/pixelflow_core/legacy_engine']))" >> "$GITHUB_ENV"
      - name: Worker tests
        shell: bash
        run: python -m unittest discover -s worker/tests -p 'test_*.py'

  desktop-check:
    name: Desktop checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run protocol:check
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: mkdir -p worker/dist-ondir/pixelflow-worker
      - run: cargo check
        working-directory: apps/desktop/src-tauri

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r worker/requirements.lock
          npm ci --prefix apps/desktop
      - name: Validate protocol
        run: npm run protocol:check
        working-directory: apps/desktop
      - name: Configure CI bundle
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          fi
          printf 'PIXELFLOW_BUILD_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          cat > apps/desktop/tauri.ci.conf.json <<'EOF'
          {"version":"VERSION","build":{"beforeBuildCommand":"python ../../worker/build_worker.py && npm run build"}}
          EOF
          sed -i '' "s/VERSION/$version/" apps/desktop/tauri.ci.conf.json
      - name: Build app and DMG
        working-directory: apps/desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri:build -- --config tauri.ci.conf.json --target aarch64-apple-darwin --bundles app,dmg
      - name: Package and attest
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/src-tauri/target -path '*/bundle/macos/PixelFlow.app' -type d -print | head -n 1)"
          dmg="$(find apps/desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -print | head -n 1)"
          test -d "$app"
          test -f "$dmg"
          file "$app/Contents/MacOS/pixelflow-desktop" worker/dist-ondir/pixelflow-worker/pixelflow-worker
          file -b "$app/Contents/MacOS/pixelflow-desktop" | grep -q arm64
          file -b worker/dist-ondir/pixelflow-worker/pixelflow-worker | grep -q arm64
          mkdir -p artifacts
          label="main-${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then label="${GITHUB_REF_NAME}"; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/PixelFlow-${label}-macos-arm64.app.zip"
          cp "$dmg" "artifacts/PixelFlow-${label}-macos-arm64.dmg"
          version="${PIXELFLOW_BUILD_VERSION}"
          printf '{"commit":"%s","version":"%s","platform":"macos","arch":"arm64","ref":"%s","signature":"unsigned"}\n' "$GITHUB_SHA" "$version" "$GITHUB_REF_NAME" > "artifacts/build-metadata-macos-arm64.json"
          shasum -a 256 artifacts/PixelFlow-*.app.zip artifacts/*.dmg artifacts/build-metadata-macos-arm64.json > "artifacts/SHA256SUMS-macos-arm64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pixelflow-macos-arm64-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS x86_64
    # GitHub-hosted Intel runner; macos-14 is arm64.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r worker/requirements.lock
          npm ci --prefix apps/desktop
      - name: Validate protocol
        run: npm run protocol:check
        working-directory: apps/desktop
      - name: Configure CI bundle
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          fi
          printf 'PIXELFLOW_BUILD_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          cat > apps/desktop/tauri.ci.conf.json <<'EOF'
          {"version":"VERSION","build":{"beforeBuildCommand":"python ../../worker/build_worker.py && npm run build"}}
          EOF
          sed -i '' "s/VERSION/$version/" apps/desktop/tauri.ci.conf.json
      - name: Build app and DMG
        working-directory: apps/desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri:build -- --config tauri.ci.conf.json --target x86_64-apple-darwin --bundles app,dmg
      - name: Package and attest
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/src-tauri/target -path '*/bundle/macos/PixelFlow.app' -type d -print | head -n 1)"
          dmg="$(find apps/desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -print | head -n 1)"
          test -d "$app"
          test -f "$dmg"
          file "$app/Contents/MacOS/pixelflow-desktop" worker/dist-ondir/pixelflow-worker/pixelflow-worker
          file -b "$app/Contents/MacOS/pixelflow-desktop" | grep -q x86_64
          file -b worker/dist-ondir/pixelflow-worker/pixelflow-worker | grep -q x86_64
          mkdir -p artifacts
          label="main-${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then label="${GITHUB_REF_NAME}"; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/PixelFlow-${label}-macos-x64.app.zip"
          cp "$dmg" "artifacts/PixelFlow-${label}-macos-x64.dmg"
          version="${PIXELFLOW_BUILD_VERSION}"
          printf '{"commit":"%s","version":"%s","platform":"macos","arch":"x86_64","ref":"%s","signature":"unsigned","runner":"GitHub-hosted macos-15-intel"}\n' "$GITHUB_SHA" "$version" "$GITHUB_REF_NAME" > "artifacts/build-metadata-macos-x64.json"
          shasum -a 256 artifacts/PixelFlow-*.app.zip artifacts/*.dmg artifacts/build-metadata-macos-x64.json > "artifacts/SHA256SUMS-macos-x64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pixelflow-macos-x64-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify source commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout does not match the event commit.' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') { throw 'Windows build requires x64.' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r worker/requirements.lock
          npm ci --prefix apps/desktop
      - name: Validate protocol
        working-directory: apps/desktop
        run: npm run protocol:check
      - name: Configure CI bundle
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $config = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            $version = $config.version.ToString()
          }
          "PIXELFLOW_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $json = @{ version = $version; build = @{ beforeBuildCommand = 'python ../../worker/build_worker.py && npm run build' } } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/tauri.ci.conf.json'), $json, [Text.UTF8Encoding]::new($false))
      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri:build -- --config tauri.ci.conf.json --target x86_64-pc-windows-msvc --bundles nsis
      # A console-subsystem executable opens a black console window alongside the
      # app, and closing that window terminates the app (CTRL_CLOSE_EVENT). The GUI
      # subsystem comes from the release-only windows_subsystem attribute in
      # main.rs, so a debug build or a dropped attribute silently reintroduces the
      # console. Assert it on the compiled binary so the regression fails the build
      # instead of depending on a real-device check.
      - name: Assert GUI subsystem (no console window)
        shell: pwsh
        run: |
          function Get-PeSubsystem {
            param([Parameter(Mandatory)][string]$Path)
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = New-Object IO.BinaryReader($stream)
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "not a PE file: $Path" }
              # The optional header starts 24 bytes past the PE signature
              # (4-byte signature + 20-byte file header).
              $optionalHeader = $peOffset + 24
              $stream.Position = $optionalHeader
              $magic = $reader.ReadUInt16()
              # PE32+ drops BaseOfData but widens ImageBase from 4 to 8 bytes,
              # so every field after ImageBase keeps the same offset. Subsystem is
              # at optional-header offset 68 for both PE32 (0x10B) and PE32+ (0x20B).
              # Reading 88 for PE32+ yields garbage (observed: 0), which is how a
              # wrong offset once failed a perfectly good GUI build.
              if ($magic -ne 0x20B -and $magic -ne 0x10B) {
                throw "unknown PE optional header magic $magic in $Path"
              }
              $stream.Position = $optionalHeader + 68
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }
          $releaseDir = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release'
          $binaries = @(Get-ChildItem $releaseDir -Filter '*.exe' -File)
          if ($binaries.Count -eq 0) { throw "no Windows executable found in $releaseDir" }
          $failures = @()
          foreach ($binary in $binaries) {
            $subsystem = Get-PeSubsystem $binary.FullName
            Write-Host "$($binary.Name): PE subsystem = $subsystem (2 = GUI, 3 = CONSOLE)"
            if ($subsystem -ne 2) {
              if ($subsystem -eq 3) {
                $failures += "$($binary.Name) (console subsystem)"
              } else {
                $failures += "$($binary.Name) (unexpected subsystem $subsystem)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            throw "GUI subsystem expected, got: $($failures -join ', '). A console build opens a window that terminates the app when closed; keep the windows_subsystem attribute in main.rs and build with the release profile."
          }
      - name: Build portable self-extracting EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' |
            Where-Object { $_.Name -notlike '*-portable.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not found.' }
          $sevenZipCandidates = @(
            (Join-Path $env:ProgramFiles '7-Zip\7z.exe'),
            (Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) '7-Zip\7z.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sevenZip = $sevenZipCandidates | Select-Object -First 1
          if (-not $sevenZip) { throw '7-Zip was not found on the Windows runner.' }
          $staging = Join-Path $env:RUNNER_TEMP 'pixelflow-nsis-extracted'
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $staging | Out-Null
          & $sevenZip x $installer.FullName "-o$staging" '-y'
          if ($LASTEXITCODE -ne 0) { throw '7-Zip could not extract the NSIS payload.' }
          $mainExe = Get-ChildItem $staging -File -Recurse |
            Where-Object { $_.Name -in @('PixelFlow.exe', 'pixelflow-desktop.exe') } | Select-Object -First 1
          if (-not $mainExe) { throw 'The NSIS payload has no PixelFlow executable.' }
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          if (-not $makensis) { throw 'NSIS compiler was not found on the Windows runner.' }
          $portableRoot = Join-Path $env:RUNNER_TEMP 'pixelflow-portable'
          Remove-Item -Recurse -Force $portableRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Windows 10 may lack the WebView2 Runtime. The portable launcher
          # carries Microsoft's Evergreen bootstrapper and runs it when needed.
          $webview2 = Join-Path $portableRoot 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview2 -UseBasicParsing
          $signature = Get-AuthenticodeSignature $webview2
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "WebView2 bootstrapper signature check failed: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $script = Join-Path $portableRoot 'portable.nsi'
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0, 12))" }
          $portableName = "PixelFlow-$label-windows-x64-portable.exe"
          $installerName = "PixelFlow-$label-windows-x64-setup.exe"
          $portable = Join-Path $env:GITHUB_WORKSPACE "artifacts/$portableName"
          $template = @'
          Unicode true
          !include "FileFunc.nsh"
          Name "PixelFlow Portable"
          OutFile "__OUTFILE__"
          Icon "__ICON__"
          RequestExecutionLevel user
          SilentInstall silent
          AutoCloseWindow true
          SetCompressor /SOLID lzma
          Var PortableDir
          !define WEBVIEW2_KEY "Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          ; Sets $R5 to 1 when a usable WebView2 Runtime is registered.
          Function DetectWebView2
            StrCpy $R5 0
            ReadRegStr $R6 HKLM "SOFTWARE\WOW6432Node\${WEBVIEW2_KEY}" "pv"
            StrCmp $R6 "" +2
            StrCmp $R6 "0.0.0.0" +1 found
            ReadRegStr $R6 HKLM "SOFTWARE\${WEBVIEW2_KEY}" "pv"
            StrCmp $R6 "" +2
            StrCmp $R6 "0.0.0.0" +1 found
            ReadRegStr $R6 HKCU "Software\${WEBVIEW2_KEY}" "pv"
            StrCmp $R6 "" done
            StrCmp $R6 "0.0.0.0" done found
            found:
            StrCpy $R5 1
            done:
          FunctionEnd
          Function EnsureWebView2
            Call DetectWebView2
            StrCmp $R5 1 ready
            MessageBox MB_YESNO|MB_ICONQUESTION "PixelFlow 需要 Microsoft Edge WebView2 运行时，这台电脑尚未安装。$\r$\n$\r$\n现在安装吗？（需要联网，约 1-3 分钟）" IDYES install
            Quit
            install:
            InitPluginsDir
            File "/oname=$PLUGINSDIR\MicrosoftEdgeWebview2Setup.exe" "__WEBVIEW2__"
            ExecWait '"$PLUGINSDIR\MicrosoftEdgeWebview2Setup.exe" /silent /install' $R7
            Call DetectWebView2
            StrCmp $R5 1 ready
            MessageBox MB_OK|MB_ICONSTOP "WebView2 运行时安装失败（代码 $R7）。$\r$\n请联网后重试，或从 https://developer.microsoft.com/microsoft-edge/webview2/ 下载“常青版独立安装程序”安装后再打开 PixelFlow。"
            Quit
            ready:
          FunctionEnd
          Function .onInit
            Call EnsureWebView2
            GetTempFileName $R0 "$TEMP"
            ${GetFileName} "$R0" $R1
            Delete "$R0"
            StrCpy $PortableDir "$TEMP\PixelFlow-$R1"
            CreateDirectory "$PortableDir"
          FunctionEnd
          Section
            SetOutPath "$PortableDir"
            File /r "__PAYLOAD__\*"
            ExecWait '"$PortableDir\__MAIN_EXE__"' $R0
            RMDir /r "$PortableDir"
            SetErrorLevel $R0
          SectionEnd
          '@
          $template = $template.Replace('__OUTFILE__', $portable).Replace('__ICON__', (Resolve-Path 'apps/desktop/src-tauri/icons/icon.ico').Path).Replace('__PAYLOAD__', $mainExe.Directory.FullName).Replace('__MAIN_EXE__', $mainExe.Name).Replace('__WEBVIEW2__', $webview2)
          $template | Set-Content -Encoding utf8BOM $script
          & $makensis /V2 $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $portable)) { throw 'NSIS portable build failed.' }
          & $sevenZip t $portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE archive validation failed.' }
          Copy-Item $installer.FullName (Join-Path $env:GITHUB_WORKSPACE "artifacts/$installerName") -Force
      - name: Smoke-test portable EXE
        shell: pwsh
        run: |
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0, 12))" }
          $portable = (Resolve-Path "artifacts/PixelFlow-$label-windows-x64-portable.exe").Path
          $events = Join-Path $env:LOCALAPPDATA 'PixelFlow\logs\worker-events.jsonl'
          $workerLog = Join-Path $env:LOCALAPPDATA 'PixelFlow\logs\worker.log'
          Remove-Item $events -Force -ErrorAction SilentlyContinue
          $launcher = Start-Process -FilePath $portable -WorkingDirectory (Get-Location).Path -PassThru
          $started = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $records = if (Test-Path $events) {
              Get-Content $events | ForEach-Object {
                try { $_ | ConvertFrom-Json } catch { $null }
              }
            } else { @() }
            $workerReady = @($records | Where-Object { $_.type -eq 'ready' -and $_.request_id -eq 'worker' }).Count -gt 0
            $pingReady = @($records | Where-Object { $_.type -eq 'ready' -and $_.request_id -eq 'main-1' }).Count -gt 0
            if ($workerReady -and $pingReady) {
              $started = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $started) {
            if (Test-Path $events) { Get-Content $events -Tail 200 }
            if (Test-Path $workerLog) { Get-Content $workerLog -Tail 200 }
            Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable smoke test did not observe PixelFlow, Worker, startup ready and ping ready events.'
          }
          $app = Get-Process | Where-Object { $_.ProcessName -match 'pixelflow' } | Select-Object -First 1
          if (-not $app) { throw 'PixelFlow process was not found after startup ready events.' }
          Start-Sleep -Seconds 30
          if (-not (Get-Process -Id $app.Id -ErrorAction SilentlyContinue)) { throw 'PixelFlow exited during the smoke test.' }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
      - name: Package and attest
        shell: pwsh
        run: |
          $version = $env:PIXELFLOW_BUILD_VERSION
          $metadata = @{ commit = $env:GITHUB_SHA; version = $version; platform = 'windows'; arch = 'x86_64'; ref = $env:GITHUB_REF_NAME; signature = 'unsigned' } | ConvertTo-Json -Compress
          Set-Content -Encoding utf8 artifacts/build-metadata-windows-x64.json $metadata
          Get-ChildItem artifacts -File | Where-Object { $_.Name -notlike 'SHA256SUMS-*' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pixelflow-windows-x64-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error

  release:
    name: Release tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pixelflow-*-${{ github.sha }}
          path: release-assets
      - name: Verify all platform metadata use this commit
        shell: bash
        run: |
          set -euo pipefail
          files=(release-assets/*/build-metadata-*.json)
          test "${#files[@]}" -eq 3
          for metadata in "${files[@]}"; do
            jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$metadata" >/dev/null
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/*/*)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
