name: PixelFlow v3

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    env:
      PYTHONPATH: worker
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        shell: bash
        run: python -m pip install -r worker/requirements.lock
      - name: Worker tests
        shell: bash
        run: python -m unittest discover -s worker/tests -p 'test_*.py'

  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run protocol:check
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      # tauri.conf.json bundles the built worker; cargo check only needs the path to exist.
      - run: mkdir -p worker/dist-ondir/pixelflow-worker
      - run: cargo check
        working-directory: apps/desktop/src-tauri
