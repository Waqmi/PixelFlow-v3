name: PixelFlow Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-actions-build-20261016
    paths-ignore:
      - downloads/**

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install worker dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.lock

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate protocol
        working-directory: apps/desktop
        run: npm run protocol:check

      - name: Use a Windows worker build hook
        shell: pwsh
        run: |
          @'
          {
            "build": {
              "beforeBuildCommand": "python ../../worker/build_worker.py && npm run build"
            }
          }
          '@ | Set-Content -Encoding utf8 apps/desktop/tauri.windows.conf.json

      - name: Build Windows NSIS bundle
        working-directory: apps/desktop
        run: npm run tauri:build -- --config tauri.windows.conf.json --target x86_64-pc-windows-msvc --bundles nsis

      - name: Build portable self-extracting EXE
        shell: pwsh
        run: |
          $installer = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/PixelFlow_3.0.0_x64-setup.exe'
          if (-not (Test-Path $installer)) {
            throw "NSIS installer was not found at $installer."
          }

          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $sevenZipCandidates = @(
            (Join-Path $env:ProgramFiles '7-Zip\7z.exe'),
            (Join-Path $programFilesX86 '7-Zip\7z.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sevenZip = $sevenZipCandidates | Select-Object -First 1
          if (-not $sevenZip) {
            throw '7-Zip was not found on the Windows runner.'
          }

          $staging = Join-Path $env:RUNNER_TEMP 'pixelflow-nsis-extracted'
          if (Test-Path $staging) {
            Remove-Item -Recurse -Force $staging
          }
          New-Item -ItemType Directory -Force $staging | Out-Null
          & $sevenZip x $installer "-o$staging" '-y'
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not extract the NSIS payload (exit code $LASTEXITCODE)."
          }

          $mainExe = Get-ChildItem -Path $staging -File -Recurse |
            Where-Object { $_.Name -in @('PixelFlow.exe', 'pixelflow-desktop.exe') } |
            Select-Object -First 1
          if (-not $mainExe) {
            Get-ChildItem -Path $staging -Recurse | Select-Object -ExpandProperty FullName
            throw 'The extracted NSIS payload does not contain the PixelFlow executable.'
          }
          $payloadRoot = $mainExe.Directory.FullName

          $worker = Get-ChildItem -Path $payloadRoot -File -Recurse |
            Where-Object { $_.Name -in @('pixelflow-worker', 'pixelflow-worker.exe') } |
            Select-Object -First 1
          if (-not $worker) {
            Get-ChildItem -Path $payloadRoot -Recurse | Select-Object -ExpandProperty FullName
            throw 'The portable payload does not contain the bundled worker sidecar.'
          }
          Get-ChildItem -Path $payloadRoot -File -Recurse |
            Where-Object { $_.Name -eq 'Uninstall.exe' } |
            Remove-Item -Force

          $makensisCommand = Get-Command 'makensis.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $makensisCommand) {
            $nsisCandidates = @(
              (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
              (Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS\makensis.exe')
            ) | Where-Object { $_ -and (Test-Path $_) }
            $makensisCommand = $nsisCandidates | Select-Object -First 1
          }
          if (-not $makensisCommand) {
            throw 'NSIS makensis.exe was not found on the Windows runner.'
          }
          $icon = (Resolve-Path 'apps/desktop/src-tauri/icons/icon.ico').Path
          if (-not (Test-Path $icon)) {
            throw "The Windows icon was not found at $icon."
          }
          Write-Host "Using NSIS compiler: $makensisCommand"

          $portableRoot = Join-Path $env:RUNNER_TEMP 'pixelflow-portable'
          if (Test-Path $portableRoot) {
            Remove-Item -Recurse -Force $portableRoot
          }
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          $script = Join-Path $portableRoot 'portable.nsi'
          $portable = Join-Path $portableRoot 'PixelFlow_3.0.0_x64-portable.exe'

          $nsisTemplate = @'
          Unicode true
          !include "FileFunc.nsh"
          Name "PixelFlow Portable"
          OutFile "__OUTFILE__"
          Icon "__ICON__"
          RequestExecutionLevel user
          SilentInstall silent
          AutoCloseWindow true
          SetCompressor /SOLID lzma
          Var PortableDir

          Function .onInit
            GetTempFileName $R0 "$TEMP"
            ${GetFileName} "$R0" $R1
            Delete "$R0"
            StrCpy $PortableDir "$TEMP\PixelFlow-$R1"
            CreateDirectory "$PortableDir"
          FunctionEnd

          Section
            SetOutPath "$PortableDir"
            File /r "__PAYLOAD__\*"
            ExecWait '"$PortableDir\__MAIN_EXE__"' $R0
            RMDir /r "$PortableDir"
            SetErrorLevel $R0
          SectionEnd
          '@
          $nsisTemplate = $nsisTemplate.Replace('__OUTFILE__', $portable)
          $nsisTemplate = $nsisTemplate.Replace('__ICON__', $icon)
          $nsisTemplate = $nsisTemplate.Replace('__PAYLOAD__', $payloadRoot)
          $nsisTemplate = $nsisTemplate.Replace('__MAIN_EXE__', $mainExe.Name)
          $nsisTemplate | Set-Content -Encoding utf8 $script

          & $makensisCommand /V2 $script
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS could not build the portable EXE (exit code $LASTEXITCODE)."
          }
          if (-not (Test-Path $portable)) {
            throw 'NSIS did not produce the portable EXE.'
          }

          & $sevenZip t $portable
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not validate the portable EXE (exit code $LASTEXITCODE)."
          }
          Copy-Item $portable 'downloads/PixelFlow_3.0.0_x64-portable.exe' -Force

      - name: Smoke-test portable EXE on Windows
        shell: pwsh
        run: |
          $portable = (Resolve-Path 'downloads/PixelFlow_3.0.0_x64-portable.exe').Path
          $log = Join-Path $env:LOCALAPPDATA 'PixelFlow\logs\worker.log'
          $logParent = Split-Path $log -Parent
          if (Test-Path $log) {
            Remove-Item $log -Force
          }
          New-Item -ItemType Directory -Force $logParent | Out-Null

          $startedAt = Get-Date
          $tempRoot = [IO.Path]::GetTempPath().TrimEnd('\')
          $beforeTemp = @(Get-ChildItem -Path $tempRoot -Directory -Force -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName)
          $launcher = Start-Process -FilePath $portable -WorkingDirectory (Get-Location).Path -PassThru
          $extractDir = $null
          $mainExecutableName = $null
          $appProcess = $null
          $workerProcess = $null
          $readySeen = $false
          $pingSeen = $false

          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $newTempDirs = @(Get-ChildItem -Path $tempRoot -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $beforeTemp -notcontains $_.FullName })
            foreach ($directory in $newTempDirs) {
              $payloadExecutables = @(Get-ChildItem -Path $directory.FullName -File -Filter '*.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike 'pixelflow-worker*' -and $_.Name -ne 'Uninstall.exe' })
              if ($payloadExecutables.Count -gt 0) {
                $extractDir = $directory.FullName
                $mainExecutableName = [IO.Path]::GetFileNameWithoutExtension($payloadExecutables[0].Name)
                break
              }
            }

            if ($extractDir) {
              $escapedExtractDir = [regex]::Escape($extractDir)
              Write-Host "Portable main executable: $mainExecutableName.exe"
              $appProcess = @(Get-CimInstance Win32_Process -Filter "Name = '$($mainExecutableName).exe'" -ErrorAction SilentlyContinue |
                Select-Object -First 1)
              $workerProcess = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -like 'pixelflow-worker*' -and
                  (([string]$_.ExecutablePath).StartsWith($extractDir, [StringComparison]::OrdinalIgnoreCase) -or
                   ([string]$_.CommandLine -match $escapedExtractDir))
                } |
                Select-Object -First 1)
            }

            if (Test-Path $log) {
              $workerLog = Get-Content -Raw $log -ErrorAction SilentlyContinue
              $readySeen = $workerLog -match 'PixelFlow worker protocol ready'
              $pingSeen = $workerLog -match 'PixelFlow worker protocol ping'
            }
            if ($appProcess -and $workerProcess -and $readySeen -and $pingSeen) {
              break
            }
            Start-Sleep -Seconds 1
          }

          $appPid = if ($appProcess) { [int]$appProcess.ProcessId } else { $null }
          Write-Host "Portable launcher PID: $($launcher.Id)"
          Write-Host "Portable launcher exited: $($launcher.HasExited)"
          if ($launcher.HasExited) {
            Write-Host "Portable launcher exit code: $($launcher.ExitCode)"
          }
          Write-Host "SFX extraction directory: $extractDir"
          Write-Host "PixelFlow process PID: $appPid"
          if ($appProcess) {
            Write-Host "PixelFlow command line: $($appProcess.CommandLine)"
          }
          if ($workerProcess) {
            Write-Host "Worker process PID: $($workerProcess.ProcessId)"
            Write-Host "Worker command line: $($workerProcess.CommandLine)"
          }
          Write-Host "WebView2 registry entries:"
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
            Where-Object { $_.name -match 'WebView2|Microsoft Edge' -or $_.pv } |
            Select-Object name, pv, PSPath | Format-List

          if (-not $appProcess) {
            Write-Host 'The portable EXE did not leave a PixelFlow process running.'
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'PixelFlow|pixelflow|WebView|Application Error' } |
              Select-Object -First 20 TimeCreated, Id, ProviderName, Message |
              Format-List
            throw 'Portable EXE smoke test failed: main process was not found.'
          }
          if (-not $workerProcess -or -not $readySeen -or -not $pingSeen) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Portable EXE smoke test failed: worker/protocol markers missing (worker=$([bool]$workerProcess), ready=$readySeen, ping=$pingSeen)."
          }

          $aliveSeconds = 30
          $diedAt = $null
          for ($second = 1; $second -le $aliveSeconds; $second++) {
            Start-Sleep -Seconds 1
            $stillRunning = Get-CimInstance Win32_Process -Filter "ProcessId = $appPid" -ErrorAction SilentlyContinue
            if (-not $stillRunning) {
              $diedAt = $second
              break
            }
          }
          if ($diedAt) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Portable EXE smoke test failed: PixelFlow exited after $diedAt seconds."
          }
          Write-Host "PixelFlow remained alive for at least $aliveSeconds seconds."
          Write-Host "Worker and protocol initialization markers were observed."
          if (Test-Path $log) { Get-Content $log -Tail 200 }

          Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
          for ($attempt = 0; $attempt -lt 20 -and -not $launcher.HasExited; $attempt++) {
            Start-Sleep -Seconds 1
            $launcher.Refresh()
          }
          if ($launcher.HasExited) {
            Write-Host "Portable launcher exit code after smoke shutdown: $($launcher.ExitCode)"
          } else {
            Write-Host 'Portable launcher remained alive after the smoke shutdown.'
            Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Commit portable EXE to branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $destination = 'downloads/PixelFlow_3.0.0_x64-portable.exe'
          if (-not (Test-Path $destination)) {
            throw "Portable EXE was not found at $destination."
          }

          if (Test-Path 'downloads/PixelFlow_3.0.0_x64-setup.exe') {
            Remove-Item 'downloads/PixelFlow_3.0.0_x64-setup.exe' -Force
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A downloads
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'The installer is unchanged; no commit is needed.'
            exit 0
          }
          git commit -m 'ci: publish Windows portable EXE'
          git push origin "HEAD:$env:GITHUB_REF_NAME"
