name: PixelFlow Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-actions-build-20261016
    paths-ignore:
      - downloads/**

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install worker dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.lock

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate protocol
        working-directory: apps/desktop
        run: npm run protocol:check

      - name: Use a Windows worker build hook
        shell: pwsh
        run: |
          @'
          {
            "build": {
              "beforeBuildCommand": "python ../../worker/build_worker.py && npm run build"
            }
          }
          '@ | Set-Content -Encoding utf8 apps/desktop/tauri.windows.conf.json

      - name: Build Windows NSIS bundle
        working-directory: apps/desktop
        run: npm run tauri:build -- --config tauri.windows.conf.json --target x86_64-pc-windows-msvc --bundles nsis

      - name: Commit Windows installer to branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $source = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/PixelFlow_3.0.0_x64-setup.exe'
          $destination = 'downloads/PixelFlow_3.0.0_x64-setup.exe'
          if (-not (Test-Path $source)) {
            throw "NSIS installer was not found at $source."
          }

          New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
          Copy-Item $source $destination -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $destination
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'The installer is unchanged; no commit is needed.'
            exit 0
          }
          git commit -m 'ci: publish Windows NSIS installer'
          git push origin "HEAD:$env:GITHUB_REF_NAME"
