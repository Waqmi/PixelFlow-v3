name: PixelFlow Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-actions-build-20261014

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install worker dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.lock

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate protocol
        working-directory: apps/desktop
        run: npm run protocol:check

      - name: Use a Windows worker build hook
        shell: pwsh
        run: |
          @'
          {
            "build": {
              "beforeBuildCommand": "python ../../worker/build_worker.py && npm run build"
            }
          }
          '@ | Set-Content -Encoding utf8 apps/desktop/tauri.windows.conf.json

      - name: Enable VBScript for WiX MSI validation
        shell: pwsh
        continue-on-error: true
        run: Enable-WindowsOptionalFeature -Online -FeatureName VBSCRIPT -All -NoRestart

      - name: Build Windows NSIS and MSI bundles
        id: tauri_build
        continue-on-error: true
        working-directory: apps/desktop
        run: npm run tauri:build -- --config tauri.windows.conf.json --target x86_64-pc-windows-msvc --bundles nsis,msi --verbose

      - name: Retry MSI linker without ICE validation
        if: steps.tauri_build.outcome == 'failure'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $wix = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          $wixOutput = 'src-tauri\target\x86_64-pc-windows-msvc\release\wix\x64\output.msi'
          $wixDirectory = Split-Path $wixOutput -Parent
          $msiOutput = 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\PixelFlow_3.0.0_x64_en-US.msi'
          $wixSource = Join-Path $wixDirectory 'main.wxs'
          $localeSource = Join-Path $wixDirectory 'locale.wxl'
          if (-not (Test-Path $wixSource)) {
            throw 'Tauri did not leave the generated WiX source for the MSI retry.'
          }

          # The generated MSI defaults to code page 1252, which cannot encode
          # the Chinese filenames in the bundled worker resources.
          $wxs = Get-Content -Raw $wixSource
          $wxs = $wxs.Replace('<Product ', '<Product Codepage="65001" ')
          Set-Content -Encoding utf8 $wixSource $wxs
          $locale = Get-Content -Raw $localeSource
          $locale = $locale.Replace('<WixLocalization ', '<WixLocalization Codepage="65001" ')
          Set-Content -Encoding utf8 $localeSource $locale

          $sourceDir = (Resolve-Path 'src-tauri\target\x86_64-pc-windows-msvc\release\pixelflow-desktop.exe').Path
          Push-Location $wixDirectory
          try {
            & (Join-Path $wix 'candle.exe') -arch x64 main.wxs "-dSourceDir=$sourceDir"
            if ($LASTEXITCODE -ne 0) {
              throw "WiX candle.exe retry failed with exit code $LASTEXITCODE."
            }
            & (Join-Path $wix 'light.exe') `
              -sval `
              -ext (Join-Path $wix 'WixUIExtension.dll') `
              -ext (Join-Path $wix 'WixUtilExtension.dll') `
              -o output.msi `
              -cultures:en-us `
              -loc locale.wxl `
              '*.wixobj'
            if ($LASTEXITCODE -ne 0) {
              throw "WiX light.exe retry failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Force (Split-Path $msiOutput -Parent) | Out-Null
          Copy-Item (Join-Path $wixDirectory 'output.msi') $msiOutput -Force

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: pixelflow-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
